[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

;; ─── Virtual Display ────────────────────────────────────────────
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x720x16 -ac +extension GLX +render -noreset
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

;; ─── Virtual Audio Sink ────────────────────────────────────────────
[program:pulseaudio]
command=/usr/bin/pulseaudio --daemonize=no --exit-idle-time=-1 --load="module-null-sink sink_name=virtual_speaker" --load="module-always-sink"
autostart=true
autorestart=true
priority=20
environment=HOME="/root"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

;; ─── VNC Server (disabled by default — set ENABLE_VNC=1 to turn on) ───
[program:x11vnc]
command=bash -c '[ "${ENABLE_VNC}" = "1" ] && exec /usr/bin/x11vnc -display :99 -forever -nopw -shared -rfbport 5900 -xkb || sleep infinity'
autostart=true
autorestart=false
priority=30
environment=DISPLAY=":99"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

;; ─── noVNC Web UI (disabled by default — set ENABLE_VNC=1 to turn on) ───
[program:novnc]
command=bash -c '[ "${ENABLE_VNC}" = "1" ] && exec /usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 || sleep infinity'
autostart=true
autorestart=false
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

;; ─── SpotiFarms Main Process ───────────────────────────────────────
[program:spotifarm]
command=node /app/src/index.js
directory=/app
autostart=true
autorestart=true
startretries=10
startsecs=10
priority=50
environment=DISPLAY=":99",PULSE_SERVER="unix:/tmp/pulse-socket",HOME="/root",NODE_ENV="production",CONFIG_PATH="/config/config.json",PROFILE_DIR="/data/chrome-profile",NODE_OPTIONS="--max-old-space-size=256"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
